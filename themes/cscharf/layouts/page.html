<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} &mdash; {{ site.title }}</title>
    {{ include 'head' }}
    {{ slot 'head' }}
</head>
<body>
    {{ slot 'body_start' }}
    {{ include 'header' }}
    <main class="page-shell article-shell">
        {{ slot 'before_content' }}
        <article class="article-content">
            <header class="article-header">
                <p class="eyebrow">{{ site.title }}</p>
                <h1>{{ page.title }}</h1>
            </header>
            {{ page.content }}
        </article>
        {{ slot 'after_content' }}
    </main>
    {{ include 'footer' }}
    {{ slot 'body_end' }}
</body>
</html>
