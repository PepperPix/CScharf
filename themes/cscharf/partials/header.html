<header class="site-header">
    <div class="header-inner">
        <a href="/" class="site-logo" aria-label="{{ site.title }}">
            <span class="logo-mark">
                <img src="{{ asset_url 'images/logo-mark.svg' }}" alt="cscharf logo" />
            </span>
            <span class="logo-text">
                <span class="logo-brand">cscharf</span>
                <span class="logo-tag">sharp thinking • warm edges</span>
            </span>
        </a>

        {{ if menus && menus.main }}
        <nav aria-label="Main navigation">
            {{ for item in menus.main }}
            <a href="{{ item.url }}"{{ if item.active }} class="active"{{ end }}>{{ item.title }}</a>
            {{ end }}
        </nav>
        {{ end }}
    </div>
</header>
