{{ if site.search.enabled }}
<div id="search" class="kiln-search" data-pagefind-root
    data-pagefind-module="{{ site.base_path }}/pagefind/pagefind.js">
    <button class="search-toggle" type="button" aria-label="Suche öffnen" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="5.5"></circle>
            <path d="M16 16L21 21"></path>
        </svg>
    </button>
    <div class="search-panel" hidden>
        <input type="search" placeholder="Suche…" aria-label="Suche auf der Website" />
        <div class="pagefind-results" hidden></div>
    </div>
</div>
<script src="{{ asset_url 'js/kiln-search.js' }}" defer></script>
{{ end }}
